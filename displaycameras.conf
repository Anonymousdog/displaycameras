# This is the configuration file for the displaycameras service intended to
# play a series of camera feeds from Ubiquity camera systems.
# This file sets the global options for the service, but the camera names,
# feeds, display windows, display window names, and rotation are set in the
# display layout files, /etc/displaycameras/layout.conf.default (required)
# and any /etc/displaycameras/layout.conf.<display resolution> you want to support
# when you enable displaydetect in this file.  See the commented layout section
# below for examples to use in the layout files.

#### Global Options

# Screen blanking is handled automatically by X11 (root window is black).
# The blank option is no longer needed and has been removed.

# Optimize reliability by tweaking stream_timeout and/or sleep factor.

# Stream network timeout (for establishing feed playback) in seconds.
# Recommend no less than 15s. Increase as you add more than six low-res or
# four mid-res feeds, or add network hops or bandwidth challenges.
# Note: old configs using "omx_timeout" still work.
stream_timeout=30

# Amount of sleep time we allow per camera when starting|restarting|repairing.
# Recommend no less than 3s start sleep and 1s feedsleep.  You may increase this
# when running higher-res feeds, a large number of cameras, or over slow
# network links.
startsleep=3
feedsleep=1
# Retry is how many seconds of sleep that the script waits after the start or feed
# sleep for mpv to first report playback, then playback beyond zero seconds.
retry=5

# Enable display detection (disabled by default) if you setup layout configuration
# files of the naming convention 'layout.conf.<display mode>' (e.g.
# layout.conf.1280x1024).  These files should include window names,
# window positions, camera names, camera feeds, and rotation configuration.
#displaydetect=true

# When rotating camera feeds across a display, how many seconds does each rotation last? (default=5)
#rotatedelay=8

# Rotate the video output for cameras mounted sideways (e.g. portrait-mounted cameras).
# Valid values: 0, 90, 180, 270. Applies to all cameras globally.
#video_rotate=0

# Extra mpv options appended to every camera instance.
# Use this to pass flags not otherwise supported by this config without editing the script.
# Example: if you see OpenGL errors on a non-standard display, add --vo=x11 here.
#mpv_extra_opts="--vo=x11"

# Disable audio decoding (default: true). Set to "false" if you need audio from camera streams.
# Saves ~3-5% CPU per stream by eliminating the audio decode thread and A/V sync overhead.
#disable_audio="true"

# Performance optimization flags are built into the script and always active:
#   --no-cache --demuxer-max-bytes=512K --demuxer-readahead-secs=1 (reduce memory ~150MB/stream)
#   --scale=bilinear --dscale=bilinear --dither=no (cheaper GPU scaling)
#   --no-osc --no-osd-bar --no-input-default-bindings (disable unused UI)
#   --demuxer-lavf-analyzeduration=0.1 --demuxer-lavf-probesize=32768 (faster stream startup)
# To override any of these, use mpv_extra_opts (mpv uses last-wins for duplicate flags).

# Hardware decode is detected automatically at startup:
#   Pi 3/4: uses v4l2m2m-copy (H.264 hardware decoder via bcm2835-codec)
#   Pi 5:   uses auto-safe (no H.264 hardware; use H.265/HEVC camera streams for hardware decode)
# To force a specific hwdec, use mpv_extra_opts (e.g. mpv_extra_opts="--hwdec=no").